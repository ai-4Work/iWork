[alembic]
script_location = alembic
prepend_sys_path = ..
# Left empty on purpose: alembic/env.py injects it from server.config.settings
# (value comes from IWORK_DATABASE_URL in i-work/.env). Keep this file ASCII-only:
# configparser reads it with the OS locale codec (GBK on Windows), not UTF-8.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
